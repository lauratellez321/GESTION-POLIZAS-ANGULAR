<div class="app-shell">
  <app-header />

  <main class="main-content">
    <header class="topbar">
      <div>
        <p class="eyebrow">GESTIÓN DE ARRENDAMIENTOS</p>
        <h1>Pólizas</h1>
        <p class="subtitle">Consulta y administra la información de tus pólizas.</p>
      </div>
    </header>

    <section class="panel create-policy" aria-labelledby="create-title">
      <div class="panel-heading">
        <div>
          <p class="eyebrow">REGISTRO</p>
          <h2 id="create-title">Nueva póliza</h2>
          <p>Ingresa la información inicial de la póliza.</p>
        </div>
      </div>

      <form class="create-form" (ngSubmit)="crearPoliza()">
        <label for="policy-type">
          Tipo de póliza
          <select id="policy-type" name="tipo" [(ngModel)]="tipoNuevaPoliza">
            <option value="INDIVIDUAL">Individual</option>
            <option value="COLECTIVA">Colectiva</option>
          </select>
        </label>

        <label for="monthly-rent">
          Canon mensual
          <input
            id="monthly-rent"
            name="canonMensual"
            type="number"
            min="0.01"
            step="0.01"
            placeholder="Ej. 1500000"
            [(ngModel)]="nuevoCanonMensual"
            required
          />
        </label>

        <label for="start-date">
          Inicio de vigencia
          <input
            id="start-date"
            name="inicioVigencia"
            type="date"
            [(ngModel)]="nuevaFechaInicio"
            required
          />
        </label>

        <label for="initial-risk">
          Riesgo inicial
          <input
            id="initial-risk"
            name="riesgoInicial"
            type="text"
            placeholder="Ej. Apartamento 302"
            [(ngModel)]="nuevoRiesgoInicial"
          />
        </label>

        <label for="months">
          Meses de vigencia
          <input
            id="months"
            name="mesesVigencia"
            type="number"
            min="1"
            step="1"
            [(ngModel)]="nuevosMesesVigencia"
            required
          />
        </label>

        <div class="create-actions">
          <button type="submit" class="button button-primary" [disabled]="guardando()">
            {{ guardando() ? 'Guardando...' : 'Crear póliza' }}
          </button>
        </div>
      </form>
    </section>

    @if (error()) {
      <div class="alert alert-error" role="alert">
        <span>{{ error() }}</span>
        <button type="button" (click)="error.set('')" aria-label="Cerrar aviso">×</button>
      </div>
    }
    @if (mensaje()) {
      <div class="alert alert-success" role="status">
        <span>{{ mensaje() }}</span>
        <button type="button" (click)="mensaje.set('')" aria-label="Cerrar aviso">×</button>
      </div>
    }

    <app-policy-summary [polizas]="polizas()" />

    <div class="workspace">
      <app-policy-list
        [polizas]="polizas()"
        [selectedId]="seleccionada()?.id ?? null"
        [loading]="cargando()"
        (filtersChanged)="aplicarFiltros($event)"
        (refresh)="cargarPolizas()"
        (select)="seleccionar($event)"
      />
      <app-policy-detail
        [poliza]="seleccionada()"
        [riesgos]="riesgos()"
        [guardando]="guardando()"
        (renovar)="renovar($event)"
        (cancelarPoliza)="cancelarPoliza()"
        (agregarRiesgo)="agregarRiesgo($event)"
        (cancelarRiesgo)="cancelarRiesgo($event)"
      />
    </div>

    <footer>Gestión de pólizas · Entorno local de desarrollo</footer>
  </main>
</div>
